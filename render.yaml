services:
  - type: web
    name: research-collaborator-portal
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.21.0
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_DEMO_PASSWORD
        sync: false
      - key: RESEARCHER_DEMO_PASSWORD
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: ENABLE_HSTS
        value: "false"
